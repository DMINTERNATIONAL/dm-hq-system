<script>

<style>
:root{--bg:#0E0E0F;--card:#18181A;--line:rgba(255,255,255,.12);--ink:#F5F5F5;--sub:rgba(245,245,245,.62);--mute:rgba(245,245,245,.42);--acc:#FFFFFF;--sab:env(safe-area-inset-bottom,0px)}

html,body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100svh;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding:28px 20px calc(28px + var(--sab))}
.logo{font-weight:800;letter-spacing:.02em;font-size:20px}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.14em;margin-top:4px}
.ev{margin-top:30px}
.price{margin-top:26px;padding-top:4px;border-top:1px solid var(--line)}
.ev .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--bg);background:var(--acc);border-radius:999px;padding:5px 10px}

table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14.5px}
th{font-size:11px;font-weight:500;color:var(--mute);text-align:right;padding-bottom:6px;letter-spacing:.04em}
th:first-child{text-align:left}
td{padding:11px 0;border-top:1px solid var(--line)}
td.p{text-align:right;white-space:nowrap}
td.p s{color:var(--mute);font-size:12.5px;margin-right:8px}
td.p b{font-size:16px;font-weight:700}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.6}
h2{font-size:13px;font-weight:600;color:var(--sub);margin:24px 0 12px;letter-spacing:.02em}
.br{display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:var(--bg);background:var(--acc);border-radius:16px;padding:18px 18px;margin-bottom:10px;min-height:74px;transition:transform .12s}
.br:active{transform:scale(.98)}
.br .t{flex:1;min-width:0}
.br .t b{display:block;font-size:17px;font-weight:800;letter-spacing:.01em}
.br .t span{display:block;font-size:13px;color:rgba(14,14,15,.62);margin-top:3px}
.br .go{font-size:13px;font-weight:700;white-space:nowrap}
.br.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.br.alt .t span{color:var(--sub)}
.same{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:2px}
.ask{display:block;text-align:center;margin-top:22px;font-size:14px;color:var(--sub);text-decoration:none;padding:14px;border:1px solid var(--line);border-radius:14px}
.ask b{color:var(--ink)}
footer{margin-top:28px;font-size:11px;color:var(--mute);letter-spacing:.14em;text-align:center}

<main class="wrap">

<script>
