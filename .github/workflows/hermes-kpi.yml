name: Hermes KPI 수집

on:
  schedule:
    # GitHub 스케줄은 정시(:00)·인기시간대에 크게 지연/드랍됨(실측 최대 8시간). 정시성 확보용으로
    # :00을 피한 애매한 분(:07)에 새벽 3회 백업 실행. 멱등+최근수집 가드(HANDSOS_FRESH_HOURS)로
    # 먼저 성공한 실행만 핸드SOS(프록시) 수집, 나머지는 매출 생략(SNS만 갱신) → 프록시 데이터 1회분만 소모.
    - cron: '7 19 * * *'   # 04:07 KST (기본)
    - cron: '7 20 * * *'   # 05:07 KST (백업1)
    - cron: '7 22 * * *'   # 07:07 KST (백업2)
    # 명세서 발행 전 지난달 전체 재수집·확정. 평소 재수집은 D-1·D-7 뿐이라
    # 익월초에 고친 월초 매출이 반영되지 않는다. 월 전체를 다시 긁어 확정한다.
    # 2일·5일 두 번 — 2일엔 대부분 잡히고, 그 뒤 늦게 고친 건 5일에 잡힌다.
    - cron: '7 21 2 * *'   # 매월 2일 06:07 KST (월 확정 재수집)
    - cron: '7 21 5 * *'   # 매월 5일 06:07 KST (월 확정 재수집 2차)
  workflow_dispatch:
    inputs:
      mode:
        description: 'both | sales | sns | month(월확정재수집) | retail(점판수익) | shops | ig(연결테스트)'
        required: false
        default: 'both'
      date:
        description: '수집일 YYYY-MM-DD (비우면 전일)'
        required: false
      from:
        description: '소급 시작일 YYYY-MM-DD (from+to 함께)'
        required: false
      to:
        description: '소급 종료일 YYYY-MM-DD'
        required: false
      ym:
        description: '대상 월 YYYY-MM (mode=month/retail, 비우면 지난달)'
        required: false
      dry:
        description: '드라이런(저장 안 함) true/false'
        required: false
        default: 'false'

concurrency:
  group: hermes-kpi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/hermes-kpi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: 수집 실행
        env:
          HANDSOS_COMPANY: ${{ secrets.HANDSOS_COMPANY }}
          HANDSOS_ID: ${{ secrets.HANDSOS_ID }}
          HANDSOS_PW: ${{ secrets.HANDSOS_PW }}
          HANDSOS_PROXY: ${{ secrets.HANDSOS_PROXY }}   # 한국 레지덴셜 프록시(핸드SOS 차단 우회). http://user:pass@host:port
          HANDSOS_CHECK_TRIES: '1'                       # 프록시 데이터 절약: 재확인 생략(D-1 1회만 수집)
          HANDSOS_REFRESH_OFFSETS: '1,7'                 # 재수집 나이 D-1·D-7만(4개→2개, 데이터 절반). 환불은 대부분 1주 내
          HANDSOS_FRESH_HOURS: '10'                      # 다중 크론 백업: D-1이 10h내 이미 수집됐으면 핸드SOS 생략(프록시 1회분만)
          HANDSOS_RETRY: '3'                             # 프록시 연결이 간헐적으로 끊김(실측 8%) → 네트워크 오류 시 새 세션으로 재시도
          # 앞 2회 크론은 실패해도 exit 0. 마지막 07:07까지 실패해야 진짜 실패로 보고 메일이 간다.
          HERMES_SOFT_FAIL: ${{ (github.event.schedule == '7 19 * * *' || github.event.schedule == '7 20 * * *') && 'true' || 'false' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode || 'both' }}"
          # 월초 크론은 지난달 전체 재수집·확정 (점판 수익 포함)
          case "${{ github.event.schedule }}" in
            "7 21 2 * *"|"7 21 5 * *") MODE="month" ;;
          esac
          ARGS="$MODE"
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date=${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.from }}" ] && ARGS="$ARGS --from=${{ github.event.inputs.from }}"
          [ -n "${{ github.event.inputs.to }}" ] && ARGS="$ARGS --to=${{ github.event.inputs.to }}"
          [ -n "${{ github.event.inputs.ym }}" ] && ARGS="$ARGS --ym=${{ github.event.inputs.ym }}"
          [ "${{ github.event.inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          echo "실행: node collect.mjs $ARGS"
          node collect.mjs $ARGS
