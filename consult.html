<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>DAY:MEAN · 사전 상담</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
:root{--ink:#0a0a0a;--muted:#a2a2a2;--faint:#c0c0c0;--line:#ececec;--line2:#e5e5e5}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{display:none;flex:1;flex-direction:column;min-height:100dvh}
.scr.on{display:flex}
.wm{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.5px;display:inline-block}
.lbl{font-size:10px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
.muted{color:var(--muted)}
.fade{opacity:0;transform:translateY(8px);animation:in .5s ease forwards}
@keyframes in{to{opacity:1;transform:none}}

.hero-photo{height:58vh;min-height:300px;background:#9ca6af;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.hero-photo .ph{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:2px}
.hero-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px}
.hero-title{font-size:15px;font-weight:500;letter-spacing:-0.2px;line-height:1.75;margin:22px 0 14px}
.hero-sub{font-size:12px;color:var(--muted);line-height:1.85}
.hero-foot{padding:0 32px calc(30px + env(safe-area-inset-bottom))}
.langs{display:flex;align-items:center;justify-content:center;gap:18px;font-size:11px;letter-spacing:.5px;margin-bottom:22px}
.langs span{color:#cacaca;cursor:pointer;padding-bottom:3px;border-bottom:1px solid transparent}
.langs span.on{color:var(--ink);border-bottom-color:var(--ink)}

.top{display:flex;justify-content:space-between;align-items:center;padding:calc(24px + env(safe-area-inset-top)) 26px 0}
.top .wm{font-size:12px}
.top .pg{font-size:9px;letter-spacing:2px;color:var(--faint)}
.bar{height:1px;background:var(--line);margin:14px 26px 0}
.bar > i{display:block;height:1px;background:var(--ink);transition:width .4s ease}
.body{flex:1;padding:34px 26px 0;overflow-y:auto}
.steplbl{font-size:10px;letter-spacing:3px;color:var(--faint);margin-bottom:8px}
.h{font-size:16px;font-weight:500;letter-spacing:-0.3px;margin-bottom:6px}
.hsub{font-size:12px;color:var(--muted);margin-bottom:30px}
.field{margin-bottom:28px}
.field > label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--faint);margin-bottom:9px}
.field input,.field select,.field textarea{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:14px;color:var(--ink);padding:0 0 9px;font-family:inherit;outline:none;border-radius:0}
.field input::placeholder,.field textarea::placeholder{color:#cacaca}
.field select{appearance:none;-webkit-appearance:none;background:transparent}
.field textarea{border:1px solid var(--line2);border-radius:12px;padding:14px;min-height:140px;resize:none;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.gsub{font-size:10px;letter-spacing:1.5px;color:var(--faint);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:8px 15px;border-radius:30px;border:1px solid var(--line2);background:#fff;color:var(--muted);font-family:inherit;cursor:pointer;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dp-item{padding:16px 12px;border:1px solid var(--line2);background:#fff;border-radius:12px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:center}
.dp-item.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:6px}
.seg .chip{flex:1;text-align:center;padding:10px 0;border-radius:8px;font-size:12px}
.hist{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.hist > b{width:46px;font-size:13px;font-weight:400;color:var(--ink)}
.hist .chip{padding:6px 13px;font-size:12px}
.foot{padding:18px 26px calc(28px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.btn{flex:1;text-align:center;font-size:12px;letter-spacing:2px;padding:15px;border-radius:30px;border:1px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;cursor:pointer}
.hero-foot .btn,.done-foot .btn{width:100%}
.btn.solid{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line2);color:var(--muted);flex:0 0 auto;padding:15px 22px}
.btn:disabled{opacity:.35;cursor:default}

.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px}
.done .ic{width:54px;height:54px;border:1px solid #d8d8d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:28px}
.done .wm{font-size:20px;margin-bottom:24px}
.done .dt{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:12px}
.done .ds{font-size:12px;color:var(--muted);line-height:1.85}
.done-foot{padding:0 32px calc(34px + env(safe-area-inset-bottom));text-align:center}
.tag{font-size:9px;letter-spacing:2.5px;color:#cdcdcd;margin-top:22px}
.err{color:#c0392b!important;border-color:#c0392b!important}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:11px 18px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>

<div class="wrap">

  <section class="scr on" id="s-hero">
    <div class="hero-photo">
      <img src="assets/hero.jpg" alt="" onerror="this.style.display='none'">
      <span class="ph" data-i="sigCut">시그니처 컷</span>
    </div>
    <div class="hero-body">
      <p class="lbl">CONSULTATION</p>
      <p class="hero-title" data-i="welcomeTitle"></p>
      <p class="hero-sub" data-i="welcomeSub"></p>
    </div>
    <div class="hero-foot">
      <div class="langs" id="langs">
        <span data-l="ko">한국어</span>
        <span data-l="en">EN</span>
        <span data-l="zh">中文</span>
        <span data-l="ja">日本語</span>
      </div>
      <button class="btn solid" onclick="heroNext()" data-i="next"></button>
    </div>
  </section>

  <section class="scr" id="s-branch">
    <div class="top"><span class="wm">DAY:MEAN</span><span class="pg"></span></div>
    <div class="body">
      <p class="steplbl">BRANCH</p>
      <p class="h" id="bp-title"></p>
      <p class="hsub" id="bp-sub"></p>
      <div id="branch-grid" style="display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" onclick="prev()" data-i="back"></button>
      <button class="btn solid" id="bp-next" onclick="startDesigner()" disabled data-i="next"></button>
    </div>
  </section>

  <section class="scr" id="s-designer">
    <div class="top"><span class="wm">DAY:MEAN</span><span class="pg"></span></div>
    <div class="body">
      <p class="steplbl">DESIGNER</p>
      <p class="h" id="dp-title"></p>
      <p class="hsub" id="dp-sub"></p>
      <div id="designer-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" onclick="prev()" data-i="back"></button>
      <button class="btn solid" id="dp-start" onclick="startForm()" disabled data-i="start"></button>
    </div>
  </section>

  <section class="scr" id="s-step">
    <div class="top"><span class="wm">DAY:MEAN</span><span class="pg" id="pg"></span></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="body" id="body"></div>
    <div class="foot">
      <button class="btn ghost" id="btnBack" onclick="prev()" data-i="back"></button>
      <button class="btn solid" id="btnNext" onclick="next()"></button>
    </div>
  </section>

  <section class="scr" id="s-done">
    <div class="done">
      <div class="ic">&#10003;</div>
      <span class="wm">DAY:MEAN</span>
      <p class="dt" id="doneTitle"></p>
      <p class="ds" id="doneSub"></p>
    </div>
    <div class="done-foot">
      <button class="btn" onclick="browse()" data-i="browse"></button>
      <p class="tag">WE MAKE A MEANINGFUL DAY</p>
    </div>
  </section>

  <section class="scr" id="s-browse">
    <div class="top"><span class="wm">DAY:MEAN</span><span onclick="go(99)" style="cursor:pointer;color:#bbb;font-size:18px">&#10005;</span></div>
    <div class="body" id="browse-body"></div>
  </section>

  <div class="toast" id="toast"></div>
</div>

};
function lx(o){return o[D.lang]||o.ko}

function setLang(l){D.lang=l;document.documentElement.lang=l;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(el){var k=el.getAttribute('data-i');if(T[l][k]!=null)el.innerHTML=T[l][k]});
  Array.prototype.forEach.call(document.querySelectorAll('#langs span'),function(s){s.classList.toggle('on',s.getAttribute('data-l')===l)});
  if(STEP>=1&&STEP<=5)renderStep();
}

function go(n){STEP=n;showScreen();if(n===0.3)renderBranchPick();if(n===0.5)renderDesignerPick();if(n===98)renderBrowse();if(n>=1&&n<=5)renderStep()}
function next(){if(STEP===1){var nm=($('f-name')||{}).value;D.name=(nm||'').trim();var stp=$('f-sns-type');D.snsType=stp?stp.value:'';var sn=$('f-sns');D.sns=sn?sn.value.trim():'';var rt=$('f-route');D.route=rt?rt.value:'';var re=$('f-route-etc');D.routeEtc=re?re.value.trim():'';var cc=$('f-country');D.country=cc?cc.value:'';if(!D.name){$('f-name').classList.add('err');toast(T[D.lang].needName);return}}
  if(STEP===5){submit();return}
  go(STEP+1)}
function prev(){if(STEP===0.3){go(0);return}if(STEP===0.5){go(0.3);return}if(STEP===1){go(0.5);return}go(STEP-1)}
function branchList(){var set={},a=[];DESIGNERS.forEach(function(d){var b=d.branch||'';if(b&&!set[b]){set[b]=1;a.push(b)}});return a}
function startDesigner(){if(!D.branch){toast(T[D.lang].pickBT);return}go(0.5)}
function renderBranchPick(){var t=T[D.lang];$('bp-title').textContent=t.pickBT;$('bp-sub').textContent=t.pickBS;$('bp-next').textContent=t.next;var bk=document.querySelector("#s-branch [data-i='back']");if(bk)bk.textContent=t.back;var g=$('branch-grid');var list=branchList();if(!list.length){g.innerHTML='<div style="text-align:center;color:#c8c8c8;font-size:13px;padding:36px 0">…</div>';$('bp-next').disabled=true;return}g.innerHTML=list.map(function(b){return '<button class="dp-item'+(b===D.branch?' on':'')+'" data-b="'+esc(b)+'">'+esc(branchLabel(b))+'</button>'}).join('');g.onclick=function(e){var btn=e.target.closest('.dp-item');if(!btn)return;var b=btn.getAttribute('data-b');if(b!==D.branch){D.branch=b;D.designerPh='';D.designer=''}Array.prototype.forEach.call(g.children,function(x){x.classList.remove('on')});btn.classList.add('on');$('bp-next').disabled=false};$('bp-next').disabled=!D.branch}
function startForm(){if(!D.designerPh){toast(T[D.lang].pickT);return}go(1)}
function renderDesignerPick(){var t=T[D.lang];$('dp-title').textContent=t.pickT;$('dp-sub').textContent=t.pickS;$('dp-start').textContent=t.start;var bk=document.querySelector("#s-designer [data-i='back']");if(bk)bk.textContent=t.back;var g=$('designer-grid');var list=DESIGNERS.filter(function(d){return !D.branch||d.branch===D.branch});if(!list.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;color:#c8c8c8;font-size:13px;padding:36px 0">…</div>';$('dp-start').disabled=true;return}g.innerHTML=list.map(function(d){return '<button class="dp-item'+(d.ph===D.designerPh?' on':'')+'" data-ph="'+esc(d.ph)+'" data-nm="'+esc(d.name)+'" data-en="'+esc(d.enName||'')+'">'+esc(dName(d))+'</button>'}).join('');g.onclick=function(e){var b=e.target.closest('.dp-item');if(!b)return;D.designerPh=b.getAttribute('data-ph');D.designer=b.getAttribute('data-nm');D.designerEn=b.getAttribute('data-en');Array.prototype.forEach.call(g.children,function(x){x.classList.remove('on')});b.classList.add('on');$('dp-start').disabled=false};$('dp-start').disabled=!D.designerPh}

function showScreen(){
  $('s-hero').classList.toggle('on',STEP===0);
  $('s-branch').classList.toggle('on',STEP===0.3);
  $('s-designer').classList.toggle('on',STEP===0.5);
  $('s-step').classList.toggle('on',STEP>=1&&STEP<=5);
  $('s-done').classList.toggle('on',STEP===99);
  $('s-browse').classList.toggle('on',STEP===98);
  if(STEP>=1&&STEP<=5){$('pg').textContent='0'+STEP+' / 05';$('barfill').style.width=(STEP*20)+'%'}
  window.scrollTo(0,0);var b=$('body');if(b)b.scrollTop=0;
}

function renderStep(){
  var t=T[D.lang],h='';
  if(STEP===1){
    h+='<p class="steplbl">STEP 01</p><p class="h">'+t.s1+'</p><p class="hsub">&nbsp;</p>';
    h+='<div class="field"><label>'+t.fName+'</label><input id="f-name" type="text" placeholder="'+esc(t.pName)+'" value="'+esc(D.name)+'"></div>';
    h+='<div class="field"><label>'+t.fDesigner+'</label><div style="border-bottom:1px solid var(--line);padding-bottom:9px;font-size:14px;display:flex;justify-content:space-between;align-items:center">'+esc((D.lang!=='ko'&&D.designerEn)?D.designerEn:(D.designer||'-'))+(PRESET?'':'<span onclick="go(0.5)" style="font-size:12px;color:#9a9a9a;cursor:pointer">'+t.change+'</span>')+'</div></div>';
    if(D.lang!=='ko'){h+='<div class="field"><label>'+t.fCountry+'</label><select id="f-country"><option value="">'+esc(t.pCountry)+'</option>'+OPT.countries.map(function(c){return '<option value="'+esc(c.ko)+'"'+(D.country===c.ko?' selected':'')+'>'+esc(lx(c))+'</option>'}).join('')+'</select></div>';}
    if(D.lang!=='ko'){h+='<div class="field"><label>'+t.fSns+'</label><select id="f-sns-type" style="margin-bottom:10px"><option value="">'+esc(t.snsTypeNone)+'</option><option value="Instagram"'+(D.snsType==='Instagram'?' selected':'')+'>Instagram</option><option value="WeChat"'+(D.snsType==='WeChat'?' selected':'')+'>'+esc(t.wechat)+'</option></select><input id="f-sns" type="text" placeholder="'+esc(t.pSnsId)+'" value="'+esc(D.sns)+'"></div>';}
    h+='<div class="field"><label>'+t.fRoute+'</label><select id="f-route" onchange="routeChg()">'+routeOpts()+'</select><input id="f-route-etc" type="text" placeholder="'+esc(t.pRouteEtc)+'" value="'+esc(D.routeEtc)+'" style="margin-top:10px;display:'+(D.route==='기타'?'block':'none')+'"></div>';
  } else if(STEP===2){
    h+='<p class="steplbl">STEP 02</p><p class="h">'+t.s2+'</p><p class="hsub">'+t.hServ+'</p>';
    h+='<div class="chips" data-multi="services">'+chipHtml(OPT.services,D.services)+'</div>';
  } else if(STEP===3){
    h+='<p class="steplbl">STEP 03</p><p class="h">'+t.s3+'</p><p class="hsub">'+t.hMood+'</p>';
    h+='<div class="chips" data-multi="mood">'+chipHtml(OPT.mood,D.mood)+'</div>';
  } else if(STEP===4){
    h+='<p class="steplbl">STEP 04</p><p class="h">'+t.s4+'</p><p class="hsub">&nbsp;</p>';
    h+='<p class="gsub">'+t.lTime+'</p><div class="seg" data-single="time">'+chipHtml(OPT.time,[D.time])+'</div>';
    h+='<div style="height:24px"></div><p class="gsub">'+t.lScalp+'</p><div class="seg" data-single="scalp">'+chipHtml(OPT.scalp,[D.scalp])+'</div>';
    h+='<div style="height:28px"></div><p class="gsub">'+t.lHist+'</p>';
    OPT.histRow.forEach(function(row){var key=row.ko;h+='<div class="hist" data-hist="'+key+'"><b>'+lx(row)+'</b>'+OPT.histMon.map(function(m){return '<button class="chip'+(D.history[key]===m.ko?' on':'')+'" data-k="'+m.ko+'">'+lx(m)+'</button>'}).join('')+'</div>'});
  } else if(STEP===5){
    h+='<p class="steplbl">STEP 05</p><p class="h">'+t.s5+'</p><p class="hsub">'+t.lMemo+'</p>';
    h+='<div class="field"><textarea id="f-memo" placeholder="'+esc(t.pMemo)+'">'+esc(D.memo)+'</textarea></div>';
    h+='<p class="gsub">'+t.quick+'</p><div class="chips" id="quick">'+OPT.quick.map(function(q){return '<button class="chip" data-q="'+esc(lx(q))+'">+ '+lx(q)+'</button>'}).join('')+'</div>';
  }
  $('body').innerHTML=h;
  $('btnNext').textContent=(STEP===5)?t.submit:t.next;
  $('btnBack').textContent=t.back;
  bindStep();
}
function chipHtml(list,sel){return list.map(function(o){return '<button class="chip'+(sel.indexOf(o.ko)>=0?' on':'')+'" data-k="'+esc(o.ko)+'">'+lx(o)+'</button>'}).join('')}

function bindStep(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-multi]'),function(c){var f=c.getAttribute('data-multi');c.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;var k=b.getAttribute('data-k');var i=D[f].indexOf(k);if(i>=0)D[f].splice(i,1);else D[f].push(k);b.classList.toggle('on')})});
  Array.prototype.forEach.call(document.querySelectorAll('[data-single]'),function(c){var f=c.getAttribute('data-single');c.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;var k=b.getAttribute('data-k');D[f]=(D[f]===k)?'':k;Array.prototype.forEach.call(c.children,function(x){x.classList.remove('on')});if(D[f])b.classList.add('on')})});
  Array.prototype.forEach.call(document.querySelectorAll('[data-hist]'),function(c){var key=c.getAttribute('data-hist');c.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;var k=b.getAttribute('data-k');D.history[key]=(D.history[key]===k)?'':k;Array.prototype.forEach.call(c.querySelectorAll('.chip'),function(x){x.classList.remove('on')});if(D.history[key])b.classList.add('on')})});
  var q=$('quick');if(q)q.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;var txt=b.getAttribute('data-q');var ta=$('f-memo');var parts=ta.value.split(',').map(function(s){return s.trim()}).filter(Boolean);var idx=parts.indexOf(txt);if(idx>=0){parts.splice(idx,1);b.classList.remove('on')}else{parts.push(txt);b.classList.add('on')}ta.value=parts.join(', ')});
}

function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},2200)}

function submit(){
  var ta=$('f-memo');if(ta)D.memo=ta.value.trim();
  var btn=$('btnNext');btn.disabled=true;
  var rec={ts:Date.now(),date:new Date().toISOString().slice(0,10),lang:D.lang,branch:D.branch,name:D.name,designer:D.designer,designerPh:D.designerPh,snsType:D.snsType,sns:D.sns,route:D.route,routeEtc:D.routeEtc,services:D.services,time:D.time,mood:D.mood,scalp:D.scalp,history:D.history,memo:D.memo,status:'new'};
  fbPost('/consults.json',rec).then(function(){showDone()}).catch(function(){btn.disabled=false;toast('전송 실패 — 다시 시도해 주세요')});
}
function showDone(){
  var t=T[D.lang];var dn=(D.lang!=='ko'&&D.designerEn)?D.designerEn:D.designer;var d=dn?(dn+(t.designerSuffix||'')):(t.designerDefault);
  $('doneTitle').innerHTML=t.doneT.replace('{d}',esc(d));
  $('doneSub').innerHTML=t.doneS;
  STEP=99;showScreen();
}
var SALON=null,BROWSE_PH='';
function browse(){go(98)}
function renderBrowse(){var body=$('browse-body');body.innerHTML='<div style="text-align:center;color:#c8c8c8;font-size:13px;padding:50px 0">불러오는 중…</div>';if(SALON){drawBrowse();return}fbG('/salonInfo.json').then(function(s){SALON=s||{};drawBrowse()}).catch(function(){body.innerHTML='<div style="text-align:center;color:#c0392b;font-size:13px;padding:50px 0">불러오기 실패</div>'})}
function browseSwitch(){BROWSE_PH=$('browse-sel').value;drawBrowse()}
function drawBrowse(){var body=$('browse-body');BROWSE_PH=BROWSE_PH||D.designerPh||(DESIGNERS[0]&&DESIGNERS[0].ph)||'';var s=SALON||{};var info=(s.designers||{})[BROWSE_PH]||{};var prices=(s.prices||{})[BROWSE_PH]||{};var menus=Array.isArray(s.menus)?s.menus:[];var sets=((s.setMenus||{})[BROWSE_PH])||[];var opts=Array.isArray(s.options)?s.options:[];var name='';DESIGNERS.forEach(function(d){if(d.ph===BROWSE_PH)name=dName(d)});var h='';
 h+='<div style="margin-bottom:24px"><select id="browse-sel" onchange="browseSwitch()" style="width:100%;border:none;border-bottom:1px solid var(--line);padding:0 0 9px;font-size:14px;background:transparent;color:var(--ink)">'+DESIGNERS.map(function(d){return '<option value="'+esc(d.ph)+'"'+(d.ph===BROWSE_PH?' selected':'')+'>'+esc(dName(d))+'</option>'}).join('')+'</select></div>';
 h+='<p style="font-size:20px;font-weight:500;margin:0 0 4px">'+esc(name||'-')+'</p>';
 if(info.specialty)h+='<p style="font-size:12px;letter-spacing:.5px;color:var(--muted);margin:0 0 12px">'+esc(info.specialty)+'</p>';
 if(info.bio)h+='<p style="font-size:13px;line-height:1.75;color:#555;margin:0 0 26px">'+esc(info.bio)+'</p>';else h+='<div style="height:8px"></div>';
 var look=Array.isArray(info.lookbook)?info.lookbook:[];
 if(look.length){h+='<p class="lbl" style="margin:0 0 10px">LOOKBOOK</p><div style="display:flex;gap:8px;overflow-x:auto;margin:0 -26px 28px;padding:0 26px">'+look.map(function(u){return '<img src="'+esc(u)+'" alt="" style="height:160px;border-radius:8px;flex:0 0 auto">'}).join('')+'</div>'}
 var mrows=menus.filter(function(m){return prices[m.name]});
 if(mrows.length){h+='<p class="lbl" style="margin:0 0 12px">MENU</p>';var CATORD=['커트','펌','컬러','클리닉','드라이'];var groups={};mrows.forEach(function(m){var c=m.cat||'기타';(groups[c]=groups[c]||[]).push(m)});var order=CATORD.filter(function(c){return groups[c]});Object.keys(groups).forEach(function(c){if(order.indexOf(c)<0)order.push(c)});order.forEach(function(c){h+='<div style="font-size:11px;letter-spacing:.5px;color:var(--faint);margin:14px 0 7px">'+esc(c)+'</div>';groups[c].forEach(function(m){h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span>'+esc(m.name||'')+'</span><span style="color:#666">'+esc(prices[m.name]||'')+(m.dur?' · '+esc(m.dur):'')+'</span></div>'})});h+='<div style="height:26px"></div>'}
 if(sets.length){h+='<p class="lbl" style="margin:0 0 12px">SET MENU</p>';sets.forEach(function(m){h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span>'+esc(m.name||'')+'</span><span style="color:#666">'+esc(m.price||'')+'</span></div>'});h+='<div style="height:26px"></div>'}
 if(opts.length){h+='<p class="lbl" style="margin:0 0 10px">OPTION</p>';opts.forEach(function(o){h+='<div style="border:1px solid #ececec;border-radius:12px;padding:13px 14px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(o.desc?'5px':'0')+'"><span style="font-size:13px;font-weight:500">'+esc(o.name||'')+'</span>'+(o.price?'<span style="font-size:12px;color:#666">'+esc(o.price)+'</span>':'')+'</div>'+(o.desc?'<p style="font-size:11px;color:var(--muted);line-height:1.6;margin:0">'+esc(o.desc)+'</p>':'')+'</div>'})}
 if(!mrows.length&&!sets.length&&!look.length&&!opts.length)h+='<div style="text-align:center;color:#c8c8c8;padding:50px 0;font-size:13px">아직 등록된 정보가 없어요</div>';
 h+='<div style="height:30px"></div>';body.innerHTML=h}

document.addEventListener('click',function(e){var s=e.target.closest('#langs span');if(s)setLang(s.getAttribute('data-l'))});

Promise.all([fbG('/users.json'),fbG('/salonInfo/designerOrder.json')]).then(function(R){var u=R[0]||{},ord=Array.isArray(R[1])?R[1]:[];var arr=[];Object.keys(u).forEach(function(ph){var x=u[ph];if(!x||x.brand!=='DAY:MEAN'||x.status==='퇴사')return;if(x.role==='디자이너'||(Array.isArray(x.roles)&&x.roles.indexOf('디자이너')>=0))arr.push({ph:ph,name:(x.nick||x.name||''),branch:(x.branch||''),enName:(x.enName||'')})});arr.sort(function(a,b){return a.name.localeCompare(b.name,'ko')});if(ord.length){arr.sort(function(a,b){var ia=ord.indexOf(a.ph),ib=ord.indexOf(b.ph);if(ia<0)ia=999;if(ib<0)ib=999;return ia-ib})}DESIGNERS=arr;if(STEP===1)renderStep();if(STEP===0.3)renderBranchPick();if(STEP===0.5)renderDesignerPick()}).catch(function(){});

setLang('ko');
